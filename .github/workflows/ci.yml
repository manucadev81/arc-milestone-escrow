name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3

      - run: forge fmt --check

      - run: forge build --sizes

      - run: forge test -vv
